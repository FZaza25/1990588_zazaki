services:
  simulator:
    image: mars-iot-simulator:multiarch_v1
    ports:
      - "8080:8080"

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
      - "29092:29092" # Questa è la tua porta "privata"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5

      
  ingestion_service:
    build: 
      context: ./source/ingestion
    depends_on:
      simulator:
        condition: service_started  
      kafka:
        condition: service_healthy
    environment:
      - SIMULATOR_URL=http://simulator:8080
      - KAFKA_BROKER=kafka:9092
    restart: on-failure

  # --- Servizi di Giulio (SISTEMATI) ---
  mars_db:
    image: postgres:15-alpine
    container_name: mars_postgres
    environment:
      POSTGRES_USER: zazaki
      POSTGRES_PASSWORD: hackathon2026
      POSTGRES_DB: mars_habitat
    ports:
      - "5432:5432"
    volumes:
      - mars_db_data:/var/lib/postgresql/data
      - ./source/automation_service/init.sql:/docker-entrypoint-initdb.d/init.sql
    #  Healthcheck per PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zazaki -d mars_habitat"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s  # Dà 10 secondi di grazia prima di iniziare i check

  state_store:
    image: redis:7-alpine
    container_name: mars_redis
    ports:
      - "6379:6379"
    #  Healthcheck per Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5
      start_period: 5s  # Dà 5 secondi di grazia

  api_gateway:
    build:
      context: ./source/automation_service
      dockerfile: docker_gateway
    environment:
      - PYTHONUNBUFFERED=1
    container_name: mars_api_gateway
    command: python -u api_gateway.py
    ports:
      - "8000:8000"
    # Aspetta che i servizi siano HEALTHY
    depends_on:
      mars_db:
        condition: service_healthy  # ← Aspetta pg_isready
      state_store:
        condition: service_healthy  # ← Aspetta redis-cli ping
      simulator:                    
        condition: service_started  

  rule_engine:
    build:
      context: ./source/automation_service
      dockerfile: docker_engine
    environment:
      - PYTHONUNBUFFERED=1
    container_name: mars_rule_engine
    command: python -u rule_engine.py
    # Aspetta che i servizi siano HEALTHY
    depends_on:
      kafka:
        condition: service_healthy  
      state_store:
        condition: service_healthy  
      simulator:                    
        condition: service_started  

volumes:
  mars_db_data:
